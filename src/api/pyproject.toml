[project]
name = "saerpa-api"
version = "0.1.0"
description = "API FastAPI do SAERPA"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "saerpa-shared",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
saerpa-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
