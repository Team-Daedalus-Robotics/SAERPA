[project]
name = "saerpa-shared"
version = "0.1.0"
description = "Entidades e infraestrutura de dados compartilhadas do SAERPA"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"
